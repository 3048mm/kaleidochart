# System database and environment configuration
[system]
db_path = "d:/My Documents/Programing/stocktool/data/stocktool.db"
user_db_path = "d:/My Documents/Programing/stocktool/data/user_data.db"
# Logging level for data pipeline (DEBUG, INFO, WARNING, ERROR)
log_level = "INFO"

[data_collection]
# Extra index, FX, or individual symbols to force-sync in addition to spreadsheet symbols
symbols = ["SPY", "QQQ", "AAPL", "^VIX", "DX-Y.NYB", "GLD", "SLV", "GBTC", "IBIT", "ETHA", "JPY=X"]
# Number of days to fetch historically on initial sync
initial_fetch_days = 2200
