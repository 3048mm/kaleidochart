# System Configuration
[system]
db_path = "d:/My Documents/Programing/stocktool/data/stocktool.db"
log_level = "INFO"

[data_collection]
# Step 1 Target Symbols
symbols = ["SPY", "QQQ", "AAPL", "^VIX", "DX-Y.NYB", "GLD", "SLV", "GBTC", "IBIT", "ETHA"]
# Number of days to fetch initially
initial_fetch_days = 1826
# Sleep between ticker requests to avoid rate limits (seconds)
sleep_seconds = 1.0

[indicators]
# Define moving average periods
sma_periods = [5, 21, 50, 63, 200]
ema_periods = [5, 21, 50, 63, 200]
atr_period = 14
