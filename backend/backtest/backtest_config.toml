# =============================================================
# Optimization Parameter Search Ranges (Optuna)
# type: "float" | "int" | "categorical"
# float/int: min, max, step
# categorical: choices  (use "none" for Python None)
# =============================================================




# =============================================================
# Optimization Evaluation Periods (Multi-period cross-validation)
# =============================================================

[optimization_periods]
periods = [
    { start = "2022-01-01", end = "2022-12-31", label = "Bear 2022" },
    { start = "2024-06-01", end = "2025-12-31", label = "Bull 2024-25" },
]

# =============================================================
# Optimization Holdout Validation (スコア計算に使わない未学習期間)
# 注意: 学習期間（optimization_periods）と重なる期間は定義しないこと。
#       2025-02〜04 は Bull 2024-25 に内包されるため使用禁止。2021 は温存（将来のブル側検証候補）。
# =============================================================

[[optimization_validation.sets]]
label = "stress_bear"   # 引き締め型ベア(2018Q4) + 事故型クラッシュ(COVID)。勝率の安定性を見る
windows = [ { start = "2018-10-01", end = "2018-12-31" }, { start = "2020-02-01", end = "2020-05-31" } ]

[[optimization_validation.sets]]
label = "calm_recent"   # レンジ相場(2023)での無駄撃ち + 学習期間より後の疑似フォワード(2026H1)
windows = [ { start = "2023-01-01", end = "2023-12-31" }, { start = "2026-01-01", end = "2026-06-30" } ]

# =============================================================
# Optimization Pruning Rules
# =============================================================
[optimization_pruning]
min_avg_hits_per_day = 1.0     # 期間中の1日平均ヒット件数の下限
# 2026-07-21: 20.0→5.0 に引き下げ。スクリーナーとして毎日大量に検出し続けるのは
# 「選別」の役割を果たさないという判断（ユーザー合意）。min_avg 同様、戦略側
# [[strategy]] に max_avg_hits_per_day を書けば個別に上書き可能（既に対応済みの仕組み。
# 現状どの戦略も上書きしておらず全戦略がこのグローバル値を共有している点に注意）。
max_avg_hits_per_day = 5.0     # 期間中の1日平均ヒット件数の上限
min_hit_rate_pct = 5.0         # 期間中、1件でもシグナルが出た営業日数の割合（極端な偏りを防ぐ）
# 2026-08-15: fast_prune（高速足切り）の発火点。min_avg_hits_per_day は
# 「評価上の実用帯の下限」であって門番ではないため、足切りはここまで下げる。
# prune_floor〜min_avg の範囲は detect_adequacy の連続的な減衰に委ねる。
# 0.2 件/日 ≒ 251営業日で50件未満（明らかに死んでいる領域）。
# 戦略側が min_avg をこれより低く設定している場合はそちらを尊重する。
prune_floor_hits_per_day = 0.2

# --- 検出件数の実用帯 detect_band（2026-07-06 目的関数再設計 / 2026-07-21 解決順序を修正）---
# スコア = 期間CAGR / DDペナルティ × detect_adequacy(avg件/日)。
# 最適化バックテストは無限資金だがスクリーンは個別銘柄シナリオテスト（有限資産）で使うため、
# 検出件数を実用帯に寄せる係数。上のハード境界（min/max_avg_hits）が門番、
# これはその内側での「多すぎず少なすぎず」のソフト選好。
# 2026-07-21: detect_lo/hi のグローバル既定値（旧: 1.0/12.0固定）を撤去。
# 未指定時は resolve_detect_band() が上のハード境界（min_avg/max_avg_hits_per_day、
# 既に戦略ごとに校正済み）にそのまま連動する。ハード側だけ戦略別に緩めてもソフト側が
# 一律のグローバル値のまま割り引く、という不整合を解消するため（詳細: doc/issue_list.md）。
# 戦略側 [[strategy]] に detect_lo/detect_hi/detect_floor を書けば依然として個別に上書き可能。
detect_floor = 0.4     # 帯外でもこれ以上は割り引かない係数の下限（優秀なスクリーンを件数だけで抹殺しない）

# --- expectancy_lcb ソフトゲート（2026-07-08 追加。CAGR主指標の右裾過適合対策）---
# CAGRは少数の巨大勝ち（右の裾）に支配されやすく、1トレード単価では勝てていない
# スクリーン（生存者バイアス疑い）を高評価しがち。期間CAGRを主指標に保ったまま、
# expectancy_lcb<=0 の期間スコアをこの係数で割り引き、頑健性を補強する。
# 1.0 で無効、0.0 で該当期間を完全に潰す。戦略側 [[strategy]] に lcb_gate_penalty で上書き可能。
# 2026-08-22: 0.5 → 0.2 に強化。質主軸の目的関数（avg_gain）は分布の裾に引っ張られ、
# 「低勝率・たまに大勝ち」の解へ寄る性質がある。実測で A/B1/B2 の3戦略すべてで
# 勝率が低下し（B1: 38.3%→32.8%）、expectancy_lcb が悪化した（B1: +0.35→-1.27）。
# B1 は 0.40 未満で lcb>0 の解（勝率38.5%・1取引5.25）が逆転することを実測で確認。
lcb_gate_penalty = 0.2


# =============================================================
# H 系: 構造ピボット (LL-HL)
# =============================================================
# 実測の経緯は doc/in_progress/structure_pivot_screener_plan.md §1。
# 素の構造ピボット単独・改良版のブレイクイベント単独はいずれもヌルを上回らなかった。
# 効いたのは「構造が成立していて、まだピボットを抜けていない（あと 2% 以内）」という
# **状態**であり、上抜けイベントではない。
# 学習 2021-03〜2024-03 / 検証 2024-03〜2026-03 の -8%ストップ付き20日リターンで
#   学習 0.57件/日 +1.11pp(±0.84) 勝率62.2% | 検証 0.71件/日 +2.07pp(±0.90) 勝率64.1%
# ADV 項（ピボット近接）を抜くと学習 -0.38pp・勝率52.4% まで落ちる。
# 既存列による近接（63日高値4%以内）では再現しない。
[[strategy]]
name = "H1_structure_pivot_ready"
description = "構造ピボットのブレイク直前（LL-HL 構造が成立し、ピボットまで 2% 以内）"
max_hits_per_day = 10
sort_column = "rs_ratio_rank_e21"
sort_ascending = false
min_sp_dist_pivot_pct = 0.0    # 上抜け済み（負値）を除外する。ブレイク「前」だけを拾う
max_sp_dist_pivot_pct = 2.0    # ピボットまで 2% 以内
min_dist_52w_high_pct = -10.0  # 52週高値から10%以内
max_vcr = 0.7                  # 収縮している土台
min_up_down_vol_ratio_50 = 1.5 # 買い集め傾向
max_allowed_dd = 30.0
min_avg_hits_per_day = 0.3

[strategy.optimization]
max_sp_dist_pivot_pct    = { type = "float", min = 1.0, max = 5.0, step = 0.5 }
min_dist_52w_high_pct    = { type = "float", min = -15.0, max = -2.5, step = 2.5 }
max_vcr                  = { type = "float", min = 0.5, max = 0.9, step = 0.05 }
min_up_down_vol_ratio_50 = { type = "float", min = 1.0, max = 2.5, step = 0.25 }


# 対照群: H1 から構造ピボットの2キーだけを抜いたもの。
# それ以外の条件・探索レンジ・検出件数ゲートは H1 と完全に揃える。
# 「構造ピボットがその席に見合う寄与をしているか」を、**両者を最適化した上で**比較するため。
# （2026-08-26: 素のアブレーションは検出件数が 360 vs 4,805 と桁違いになり比較が成立しなかった）
[[strategy]]
name = "H1c_no_pivot_control"
description = "対照: H1 から構造ピボットを抜き、残りの条件だけを同じレンジで最適化する"
max_hits_per_day = 10
sort_column = "rs_ratio_rank_e21"
sort_ascending = false
min_dist_52w_high_pct = -10.0
max_vcr = 0.7
min_up_down_vol_ratio_50 = 1.5
max_allowed_dd = 30.0
min_avg_hits_per_day = 0.3

[strategy.optimization]
min_dist_52w_high_pct    = { type = "float", min = -15.0, max = -2.5, step = 2.5 }
max_vcr                  = { type = "float", min = 0.5, max = 0.9, step = 0.05 }
min_up_down_vol_ratio_50 = { type = "float", min = 1.0, max = 2.5, step = 0.25 }
