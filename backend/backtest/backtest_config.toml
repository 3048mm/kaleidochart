max_rs_blue_dot_age = { type = "int",   min = 0,   max = 40,  step = 1 }
min_market_cap      = { type = "categorical", choices = [1e8, 3e8] }





# =============================================================
# H3: カウンタートレンド線の上抜け（作者の rt_cnt_break）
#   構造（LL-HL）が成立していない期間に、ショート側のピボット高値2点を結んだ
#   下向きの抵抗線を終値が上抜ける「転換」シグナル。sp_pivot とは排他。
#
# 検出件数の実測（2026-09-03 ドライラン / 個別 active 2,889銘柄 / 1,256営業日）:
#   生 32.13件/日 → 流動性床 $2M で 26.34件/日 → 下記の既定値で 2.24件/日
#   Bear 2022 = 3.22件/日 / Bull 2024-25 = 2.20件/日（どちらもゲート帯 0.3〜5.0 の内側）
#
# **H系で唯一「検出が過剰」な戦略。** H1 が全滅した原因は検出不足による枠遊びだったが、
# H3 は候補が 26件/日 出るため max_hits_per_day の枠が実効的に効く。
# したがって sort_column の選択がスコアを強く左右する
# （doc/in_progress/trend_line_break_optimization_plan.md §4-Q1。まず rs_ratio_rank_e21）。
#
# 単一条件の効き（流動性床の上に1つだけ足したとき・累積ではない）:
#   max_vcr<=0.8 → 3.89 / min_rs_trend_s21>=1.0 → 8.63 / min_adr_pct_21>=4 → 8.99
#   close>ema21 → 16.65 / mcap>=1e9 → 22.11 / sma50_atr_mult<=8 → 26.31（ほぼ無効）
# max_sma50_atr_mult は探索空間から外した。3.0〜10.0 を実測しても 2.011〜2.304件/日 と
# ほとんど動かず（最厳の 3.0 でも -13% だけ）、次元を1つ食うだけで情報を持たない。
# =============================================================
[[strategy]]
name = "H3_structure_trend_line_break"
description = "構造が無い期間のカウンタートレンド線を上抜けた転換シグナル"
max_hits_per_day = 10
sort_column = "rs_ratio_rank_e21"
sort_ascending = false
is_structure_trend_line_break = true
# 2026-09-03: 200トライアルの best trial 163 を反映（score 0.917 / Alpha +2.87% /
# ホールドアウト LCB +1.17 / +1.50）。H3b（ゲート開放）と H3c（収縮を締める）は
# どちらもホールドアウトで劣後した。詳細は
# doc/completed/trend_line_break_optimization_plan.md §7-6 / §7-7
min_adr_pct_21 = 6.5
min_rs_trend_s21 = 0.925
min_dist_21ema_pct = 0.0
max_vcr = 0.90
min_market_cap = 1e8
# 流動性床は [general] が全戦略へ実行時注入するため戦略側には書かない
# min_avg_hits_per_day / quality_gate_min_hits_per_day は書かない。
# グローバル既定（1.0 / 0.3）で足りる（H1 が抱えた下限割れが H3 には無い）
#
# **[strategy.optimization] の全キーに既定値を書くこと。** enqueue_baseline_trial は
# strat_base に有る分だけを enqueue_trial() に渡し、**残りはサンプラーが乱択する**。
# 書き漏らすとベースライン trial が別物になる（2026-09-03 に max_vcr を書き忘れ、
# 0.75 が乱択されて trial 0 が検出 0.12件/日 → 罰点 -260.96 になった）。

[strategy.optimization]
min_adr_pct_21     = { type = "float", min = 2.0, max = 7.0, step = 0.5 }
min_rs_trend_s21   = { type = "float", min = 0.90, max = 1.15, step = 0.025 }
# TLB は「直近が弱い」期間に点灯するため 21EMA の下で出るのが自然な形。
# H1 の下限 0.0 をそのまま使うと本来の母集団を切り落とすので負側まで開ける
min_dist_21ema_pct = { type = "float", min = -3.0, max = 5.0, step = 0.5 }
# 下限 0.80: 実測で 0.60→0.003 / 0.70→0.045 / 0.75→0.099 / 0.80→0.184 件/日 と
# **0.85 未満は他条件の既定値と併用すると検出ゲートを割る死に領域**。0.80 だけ残して
# TPE に勾配を与える。上限 1.5 は実質「収縮を要求しない」（制約なし比 -6%）
max_vcr            = { type = "float", min = 0.80, max = 1.50, step = 0.05 }
# 効きは弱いが検出件数の微調整枠として残す（ユーザー判断 2026-09-03）
min_market_cap     = { type = "categorical", choices = [1e8, 3e8, 1e9, 3e9] }


# =============================================================
# H3b: H3 の検出件数ゲートを緩めて「もっと締めた領域」を評価できるようにした版
#
# H3（200トライアル）の結果、スコア上位が min_adr_pct_21 の上限 7.0 に 62%、
# max_vcr が死に領域の直上 0.90 に張り付いた。実測すると両方とも
# **「もっと締めたいが検出件数ゲートに阻まれている」**状態だった:
#   adr 7.5 → 0.333件/日（生存） / 8.0 → 0.242（ゲート際） / 8.5 → 0.176（罰点）
#   vcr 0.85 → 0.340 / 0.80 → 0.184（罰点）
# 一方 min_rs_trend_s21 と min_market_cap の張り付きは**下方向に効かないだけ**で、
# 緩めても件数が動かない（rs 0.90→0.75 で 0.451→0.454、mcap 1e8→0 で 0.443→0.451）。
# したがって「範囲を広げる」より**ゲートを開けて締める方向を評価可能にする**のが本筋。
#
# min_avg_hits_per_day を E1（VCP ブレイクアウト＝稀なのが仕様）と同じ 0.05 に置く。
# resolve_prune_floor と quality_gate はどちらも「戦略側がより低い値を宣言していれば
# それを尊重する」流儀なので、この1行で罰点下限もゲート下限も 0.05 に下がる。
#
# **この study の目的は最良パラメータ探しではなく「締めるほど質が上がり続けるか」の確認。**
# 検出が薄くなるぶん統計は粗くなるが、expectancy_lcb は標本数を織り込む（期待値 - 2SE）
# ので、薄さゆえの見かけの良さは LCB 側で自動的に割り引かれる。
# =============================================================
[[strategy]]
name = "H3b_structure_tlb_tight"
description = "H3 の検出ゲートを緩め、収縮と値動きをより締めた領域を評価する"
max_hits_per_day = 10
sort_column = "rs_ratio_rank_e21"
sort_ascending = false
is_structure_trend_line_break = true
# ベースライン = H3 の best trial 163（score 0.917 / Alpha +2.87%）
min_adr_pct_21 = 6.5
min_rs_trend_s21 = 0.925
min_dist_21ema_pct = -0.5
max_vcr = 0.7
min_market_cap = 1e8
# 検出ゲートを開ける（E1 と同じ値。この2行が H3 との唯一の設計差）
min_avg_hits_per_day = 0.05
min_hit_rate_pct = 0.3

[strategy.optimization]
# 上限 10.0 まで開ける（実測 0.071件/日。ゲート 0.05 の内側）
min_adr_pct_21     = { type = "float", min = 2.0, max = 10.0, step = 0.5 }
# 下限は 0.90 のまま。0.90 未満は件数が動かず（0.451→0.454）情報を持たない
min_rs_trend_s21   = { type = "float", min = 0.90, max = 1.15, step = 0.025 }
min_dist_21ema_pct = { type = "float", min = -3.0, max = 5.0, step = 0.5 }
# 下限を 0.70 まで戻す（H3 では 0.80 未満が罰点だったが、ゲートを開けたので評価可能）
max_vcr            = { type = "float", min = 0.70, max = 1.50, step = 0.05 }
# 1e8 未満は候補が全期間で6件しか無く（$100M未満）、選択肢に足しても意味が無い
min_market_cap     = { type = "categorical", choices = [1e8, 3e8, 1e9, 3e9] }


# =============================================================
# H3c: 収縮（vcr）を締め、値動き（adr）を緩めて検出件数を確保する版
#
# H3b で「検出ゲートを開けて締める」を試した結果は**過学習**だった:
#   in-sample スコア 0.917 → 6.589（44取引・0.068件/日）まで上がる一方、
#   ホールドアウトの LCB が +1.17/+1.50 → **-1.24/-8.21** に崩壊した。
#   検出件数ゲート 0.3件/日 は、この戦略に関しては正しく機能していた。
#
# そこで H3c は**ゲートを既定（0.3）に戻した上で**、探索空間を
# 「vcr を締めて adr を緩める」側へずらす。vcr × adr 平面の実測（rs/dist/mcap は
# H3 best 固定・件/日）:
#
#            adr2.0  adr3.0  adr4.0  adr5.0  adr6.0  adr7.0
#   vcr0.65   0.157   0.116   0.071   0.056   0.039   0.025   ← 全域が罰点
#   vcr0.70   0.384   0.281   0.182   0.131   0.091   0.056
#   vcr0.75   0.821   0.582   0.398   0.281   0.201   0.108
#   vcr0.80   1.522   1.042   0.696   0.492   0.346   0.193
#   vcr0.90   3.574   2.525   1.665   1.102   0.742   0.443   ← H3 best は右下
#
# **同じ 0.4件/日 でも中身の違う動作点が複数ある**のがポイント:
#   vcr0.90 × adr7.0 = 0.443（H3 best） / vcr0.75 × adr4.0 = 0.398
#   vcr0.70 × adr2.0 = 0.384
# H3 の探索空間は vcr 下限 0.80 だったので、この左上側を見ていない。
# 下限を 0.65 まで下げて、ゲートに守られた状態で左上を探索させる。
# =============================================================
[[strategy]]
name = "H3c_structure_tlb_contraction"
description = "収縮を締めて値動きを緩め、検出件数を保ったまま収縮側のエッジを測る"
max_hits_per_day = 10
sort_column = "rs_ratio_rank_e21"
sort_ascending = false
is_structure_trend_line_break = true
# ベースラインは新領域の等検出点（0.398件/日）を置く。H3 best（右下）ではなく
# 左上から始めることで、TPE が最初から新領域を見る
min_adr_pct_21 = 5.5
min_rs_trend_s21 = 0.925
min_dist_21ema_pct = 2.0
max_vcr = 0.9
min_market_cap = 1e8
# 検出件数ゲートは**既定のまま**（H3b の過学習を繰り返さないための要）。
# min_avg_hits_per_day / min_hit_rate_pct は意図的に書かない

[strategy.optimization]
min_adr_pct_21     = { type = "float", min = 2.0, max = 7.0, step = 0.5 }
min_rs_trend_s21   = { type = "float", min = 0.90, max = 1.15, step = 0.025 }
min_dist_21ema_pct = { type = "float", min = -3.0, max = 5.0, step = 0.5 }
# ここが H3 との差。下限 0.80 → 0.65（vcr0.65 は全域罰点だが勾配を与えるため残す）、
# 上限 1.50 → 0.95（H3 で 1.00 以上は劣化が確認済み。枠を無駄にしない）
max_vcr            = { type = "float", min = 0.65, max = 0.95, step = 0.05 }
min_market_cap     = { type = "categorical", choices = [1e8, 3e8, 1e9, 3e9] }


