# Backtest Engine Configuration
# パラメータセットは [[strategy]] を追加するだけで自由に拡張可能

[general]
start_date = "2021-03-26"
end_date   = "2026-03-26"
failsafe_max_days = 120

# --- Exit Rules (固定) ---
[exit_rules]
stop_loss_pct = -8.0
partial_take_profit_pct = 20.0
partial_take_profit_sma50_atr = 8.0
partial_ratio = 0.333
full_exit_ema21_consecutive_days = 2
full_exit_sma50_atr = 11.0
time_stop_days = 7
# time_stop_range < 1 ATR

# =============================================================
# Strategy Parameter Sets
# =============================================================

[[strategy]]
name = "A_momentum_breakout"
description = "出来高を伴った急騰銘柄 (攻撃的)"
max_hits_per_day = 10
sort_column = "rs21_rank"
sort_ascending = false
min_1d_gain_pct = 4.0
min_vol_surge_21 = 1.5
min_adr_pct_21 = 4.0
max_dist_sma50_atr = 6.0
min_market_cap = 1e9
rs_rank_21_gt_63 = true

[[strategy]]
name = "B_theme_momentum"
description = "強いテーマに属する銘柄のモメンタム"
max_hits_per_day = 10
sort_column = "rs21_rank"
sort_ascending = false
min_1d_gain_pct = 2.0
min_vol_surge_21 = 1.0
min_adr_pct_21 = 4.0
max_dist_sma50_atr = 6.0
min_market_cap = 1e7
theme_rs21_gt_63 = true

[[strategy]]
name = "C_rrg_leading_in"
description = "RRG Leading象限に転換した銘柄"
max_hits_per_day = 10
sort_column = "rs21_rank"
sort_ascending = false
rrg_leading_in = true
min_vol_surge_21 = 1.0
min_adr_pct_21 = 4.0
max_dist_sma50_atr = 6.0
min_market_cap = 1e9

[[strategy]]
name = "D_ema21_pullback"
description = "上昇トレンド中のEMA21押し目買い"
max_hits_per_day = 10
sort_column = "rs21_rank"
sort_ascending = false
min_dist_21ema_pct = -2.0
max_dist_21ema_pct = 2.0
max_dist_sma50_atr = 4.0
min_rs_ratio_21_rank = 0.7
min_market_cap = 1e9
trend_template_ok = 1

[[strategy]]
name = "E_vcp"
description = "ボラティリティ収縮パターン"
max_hits_per_day = 10
sort_column = "rs21_rank"
sort_ascending = false
max_adr_pct_21 = 3.0
close_gt_sma50 = true
min_rs_condition_21 = 1.0
rs_rank_21_gt_63 = true
min_market_cap = 1e9

[[strategy]]
name = "F_elite_momentum97"
description = "RS上位3%のエリート銘柄"
max_hits_per_day = 10
sort_column = "rs21_rank"
sort_ascending = false
min_rs_ratio_21_rank = 0.97
trend_template_ok = 1
min_market_cap = 3e8

# =============================================================
# Optimization Parameter Search Ranges (Optuna)
# type: "float" | "int" | "categorical"
# float/int: min, max, step
# categorical: choices  (use "none" for Python None)
# =============================================================

[optimization.B]
min_1d_gain_pct    = { type = "float", min = 1.0, max = 10.0, step = 0.5 }
min_vol_surge_21   = { type = "float", min = 0.5, max = 3.0, step = 0.1 }
min_adr_pct_21     = { type = "float", min = 1.0, max = 6.0, step = 0.5 }
max_dist_sma50_atr = { type = "float", min = 2.0, max = 8.0, step = 0.5 }
min_market_cap     = { type = "categorical", choices = [1e5, 5e5, 1e6, 5e6, 1e7, 5e7, 1e8, 3e8, 1e9] }
theme_rs21_gt_63   = { type = "categorical", choices = [true] }

[optimization.D]
min_dist_21ema_pct   = { type = "float", min = -4.0, max = -1.0, step = 0.5 }
max_dist_21ema_pct   = { type = "float", min = 0.5,  max = 4.0,  step = 0.5 }
max_dist_sma50_atr   = { type = "float", min = 2.0,  max = 6.0,  step = 0.5 }
min_rs_ratio_21_rank = { type = "float", min = 0.50, max = 0.90, step = 0.05 }
min_market_cap       = { type = "categorical", choices = [1e8, 3e8, 5e8, 1e9] }
trend_template_ok    = { type = "categorical", choices = [1] }

[optimization.F]
min_rs_ratio_21_rank = { type = "float", min = 0.85, max = 0.99, step = 0.01 }
min_market_cap       = { type = "categorical", choices = [1e7, 1e8, 3e8, 5e8, 1e9] }
min_adr_pct_21       = { type = "float", min = 1.0, max = 4.0, step = 0.5 }
trend_template_ok    = { type = "categorical", choices = [1, "none"] }

# =============================================================
# Optimization Evaluation Periods (Multi-period cross-validation)
# =============================================================

[optimization_periods]
periods = [
    { start = "2022-01-01", end = "2022-12-31", label = "Bear 2022" },
    { start = "2024-06-01", end = "2025-12-31", label = "Bull 2024-25" },
]

# =============================================================
# Optimization Pruning Rules
# =============================================================
[optimization_pruning]
min_avg_hits_per_day = 2.0     # 期間中の1日平均ヒット件数の下限
max_avg_hits_per_day = 20.0    # 期間中の1日平均ヒット件数の上限
min_hit_rate_pct = 5.0         # 期間中、1件でもシグナルが出た営業日数の割合（極端な偏りを防ぐ）
