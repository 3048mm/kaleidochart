# Backtest Engine Configuration
# パラメータセットは [[strategy]] を追加するだけで自由に拡張可能

[general]
start_date = "2021-03-26"
end_date   = "2026-03-26"
failsafe_max_days = 120
consider_tax = 0.0
# エントリー方式: "close"=シグナル当日終値（オーバーナイト発注運用と整合） / "next_open"=翌営業日寄付（保守側の感度計測用）
entry_mode = "close"
# 流動性ハード制約（最適化対象外・全戦略共通）: 21日平均売買代金がこの値未満の銘柄はシグナル対象外
min_avg_dollar_volume_21 = 2e6

# --- Exit Rules (固定) ---
[exit_rules]
exit_type = "fixed"              # "fixed", "hold", "vxv_vix_ratio"
vxv_vix_threshold = 1.0          # Used when exit_type = "vxv_vix_ratio"
stop_loss_pct = -8.0
partial_take_profit_pct = 20.0
partial_take_profit_sma50_atr_mult = 8.0
partial_ratio = 0.333
full_exit_ema21_consecutive_days = 2
full_exit_sma50_atr_mult = 11.0
time_stop_days = 7
# time_stop_range < 1 ATR

# =============================================================
# Strategy Parameter Sets
# =============================================================



