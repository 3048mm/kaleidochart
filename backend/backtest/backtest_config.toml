# =============================================================
# Optimization Parameter Search Ranges (Optuna)
# type: "float" | "int" | "categorical"
# float/int: min, max, step
# categorical: choices  (use "none" for Python None)
# =============================================================




# =============================================================
# Optimization Evaluation Periods (Multi-period cross-validation)
# =============================================================

[optimization_periods]
periods = [
    { start = "2022-01-01", end = "2022-12-31", label = "Bear 2022" },
    { start = "2024-06-01", end = "2025-12-31", label = "Bull 2024-25" },
]

# =============================================================
# Optimization Holdout Validation (スコア計算に使わない未学習期間)
# 注意: 学習期間（optimization_periods）と重なる期間は定義しないこと。
#       2025-02〜04 は Bull 2024-25 に内包されるため使用禁止。2021 は温存（将来のブル側検証候補）。
# =============================================================

[[optimization_validation.sets]]
label = "stress_bear"   # 引き締め型ベア(2018Q4) + 事故型クラッシュ(COVID)。勝率の安定性を見る
windows = [ { start = "2018-10-01", end = "2018-12-31" }, { start = "2020-02-01", end = "2020-05-31" } ]

[[optimization_validation.sets]]
label = "calm_recent"   # レンジ相場(2023)での無駄撃ち + 学習期間より後の疑似フォワード(2026H1)
windows = [ { start = "2023-01-01", end = "2023-12-31" }, { start = "2026-01-01", end = "2026-06-30" } ]

# =============================================================
# Optimization Pruning Rules
# =============================================================
[optimization_pruning]
min_avg_hits_per_day = 1.0     # 期間中の1日平均ヒット件数の下限
max_avg_hits_per_day = 20.0    # 期間中の1日平均ヒット件数の上限
min_hit_rate_pct = 5.0         # 期間中、1件でもシグナルが出た営業日数の割合（極端な偏りを防ぐ）
