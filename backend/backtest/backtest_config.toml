# E1/E2 は 2026-07-05 に状態版 VCP から「ブレイクアウトイベント版」へ、
# 2026-07-14 に再び状態版へ復元（個別銘柄シナリオテストで大敗・PF0.7〜1.3。ブレイク日の引けで
# 追いかけ買いする構造が実運用と噛み合わなかった。最適化バックテストが求めた「シグナルの独立性」は
# 2026-07-05 の再エントリーブロック（exit まで同一銘柄スキップ）で既に測定器側で解決済み
# だったため、イベント化の当初動機は別の対策で不要になっていた）。詳細:
# doc/completed/e3_vcp_breakout_plan.md（イベント化の経緯）/
# doc/completed/e4_vcp_pivot_dryup_plan.md（ピボットクロス・ドライアップ追加）/
# doc/completed/e5_vcp_state_restore_plan.md（状態版への復元・質ゲート移植）
#
# is_vcp_breakout（イベント版フィルタ本体）は現在どの戦略にも使われていないが、
# テスト済みの汎用フィルタとして温存（将来「ブレイク通知」用途で使う可能性）。
# 旧 study は E1_old/E2_old 等でユーザーが退避してから再最適化する運用。
#
# 2026-07-16: 2026-07-15 の最適化バックテスト再最適化ベストを個別銘柄シナリオテストで実測したところ、
# baseline手動値（実測 E1 +71.7%/PF3.12・E2 +66.2%/PF4.54）に対し明確に見劣りした
# （最適化バックテストベストの実測: E1 +43〜48%/PF3.0〜3.3・E2 +42.3%/PF3.42）。最適化が
# max_adr_pct_21（静けさ）を大幅に緩め・min_market_cap を大幅に下げる方向へ振れ、
# VCP の「質」コンセプト（静かな値動き・大型株）が探索空間内で崩れたのが主因と判断。
# B2 で min_adr_pct_21 の探索下限を上げてコンセプトを防衛した前例と同型の対処として、
# 以下の探索レンジを引き締めた（詳細: doc/issue_list.md の該当項目）。
#
# 2026-07-18: 個別銘柄シナリオテスト実測で E1/E2 は B2/B4/B6 と比べて PF・DD は圧倒的に優れる（PF 3.1〜5.2 vs
# 1.4〜2.4、DD 8%台 vs 20〜28%）が、CAGR は最下位（7〜14% vs 18〜82%）。原因はトレード数の
# 少なさ（4年強で117〜213件 vs B系228〜312件）で、最大8ポジションの枠が遊び複利が効かない。
# さらに最適化バックテストは vcr/vol_surge をより厳しくして取引数を減らす方向（213→136 for E1）へ振れ、
# CAGR をむしろ悪化させていた。static な「質」ゲート（vcr/adr/vol_surge/dist）は 2026-07-16/17
# の引き締めのまま維持しつつ、min_market_cap の下限のみ緩めて機会を増やす実験を行う
# （B2等は mcap 下限が桁違いに低くても質が保てているため、まず mcap 単独で頻度を稼げるか検証）。

[[strategy]]
