# E1/E2 は 2026-07-05 に状態版 VCP から「ブレイクアウトイベント版」へ作り直し。
# 旧 study は E1_old/E2_old でユーザーが退避（is_vcp_breakout はイベントなので発火が疎・
# 各シグナルが独立で LCB が正直になる）。詳細: doc/completed/e3_vcp_breakout_plan.md
#
# is_vcp_breakout=true に付随するフィルタ内パラメータ（RRG の intensity_threshold と同じ扱い）:
#   breakout_high_window: 高値近傍ゲートのウィンドウ（63=3ヶ月ベース / 252=52週高値）
#   vcr_contraction_max : 前日までの収縮度上限（ATR10/ATR50）
#   base_high_tol       : 前日の 52週高値からの許容乖離（%。土台の浅さ）
#   near_high_tol       : 当日が N日高値からどれだけ以内か（緩い近傍ゲート）
#   breakout_change     : ブレイクの大陽線（change_1d_pct の下限。イベントトリガー）
#   breakout_vol_mult   : 当日の出来高膨張の下限（vol_surge_21）

[[strategy]]
name = "E1_vcp_breakout_mid"
description = "VCP 収縮からの中期(63日高値近傍)ブレイクアウト（出来高を伴う大陽線イベント）"
max_hits_per_day = 10
sort_column = "rs_ratio_rank_e21"
sort_ascending = false
is_vcp_breakout = true
breakout_high_window = 63
vcr_contraction_max = 0.85
base_high_tol = 10.0
near_high_tol = 4.0        # 当日は63日高値から4%以内（緩い近傍ゲート）
breakout_change = 4.0      # ブレイクの大陽線（イベントトリガー）
breakout_vol_mult = 2.1
min_market_cap = 3e8
max_allowed_dd = 20.0
min_avg_hits_per_day = 0.05   # イベント系は疎なので下限を緩める
min_hit_rate_pct = 0.3

[strategy.optimization]
# is_vcp_breakout / breakout_high_window は固定だが、シナリオテスト（型3）が Optuna の
# z_params_toml を screener_presets.toml に貼って使うため、単一カテゴリカルで出力に含める
# （A/B の特殊フラグと同じパターン。欠落するとプリセットでフィルタが発火せずサイレント失敗）
is_vcp_breakout      = { type = "categorical", choices = [true] }
breakout_high_window = { type = "categorical", choices = [63] }
vcr_contraction_max = { type = "float", min = 0.5, max = 0.9, step = 0.05 }
base_high_tol       = { type = "float", min = 5.0, max = 25.0, step = 5.0 }
near_high_tol       = { type = "float", min = 2.0, max = 8.0, step = 1.0 }
breakout_change     = { type = "float", min = 2.0, max = 7.0, step = 0.5 }
breakout_vol_mult   = { type = "float", min = 1.2, max = 3.0, step = 0.1 }
min_market_cap      = { type = "categorical", choices = [5e7, 1e8, 3e8, 1e9] }

[[strategy]]
name = "E2_vcp_breakout_52w"
description = "VCP 収縮からの52週高値近傍ブレイクアウト（出来高を伴う大陽線・最高確度で最も稀なイベント）"
max_hits_per_day = 10
sort_column = "rs_ratio_rank_e21"
sort_ascending = false
is_vcp_breakout = true
breakout_high_window = 252
vcr_contraction_max = 0.85
base_high_tol = 10.0
near_high_tol = 4.0        # 当日は52週高値から4%以内
breakout_change = 4.0      # ブレイクの大陽線
breakout_vol_mult = 2.1
min_market_cap = 1e8
max_allowed_dd = 20.0
min_avg_hits_per_day = 0.02   # 52週新高値はさらに稀
min_hit_rate_pct = 0.2

[strategy.optimization]
is_vcp_breakout      = { type = "categorical", choices = [true] }
breakout_high_window = { type = "categorical", choices = [252] }
vcr_contraction_max = { type = "float", min = 0.5, max = 0.9, step = 0.05 }
base_high_tol       = { type = "float", min = 5.0, max = 25.0, step = 5.0 }
near_high_tol       = { type = "float", min = 2.0, max = 8.0, step = 1.0 }
breakout_change     = { type = "float", min = 2.0, max = 7.0, step = 0.5 }
breakout_vol_mult   = { type = "float", min = 1.2, max = 3.0, step = 0.1 }
min_market_cap      = { type = "categorical", choices = [5e7, 1e8, 3e8, 1e9] }

[[strategy]]
name = "F_elite_momentum97"
description = "RS上位3%のエリート銘柄"
max_hits_per_day = 10
sort_column = "rs_ratio_rank_e21"
sort_ascending = false
min_rs_ratio_rank_e21 = 0.97
is_trend_template = true
min_adr_pct_21 = 2.5
min_market_cap = 3e8
max_sma50_atr_mult = 6.0
min_vol_accum_days_5 = 3
max_allowed_dd = 30.0   # MTM 再校正（旧: 未設定=デフォルト 20.0）

[strategy.optimization]
min_rs_ratio_rank_e21 = { type = "float", min = 0.97, max = 0.99, step = 0.01 }
min_market_cap       = { type = "categorical", choices = [3e8, 5e8, 1e9] }
min_adr_pct_21       = { type = "float", min = 2.0, max = 3.5, step = 0.5 }
is_trend_template    = { type = "categorical", choices = [true] }
max_sma50_atr_mult   = { type = "float", min = 4.0, max = 8.0, step = 1.0 }
min_vol_accum_days_5   = { type = "categorical", choices = [3] }


# =============================================================
# Optimization Parameter Search Ranges (Optuna)
# type: "float" | "int" | "categorical"
# float/int: min, max, step
# categorical: choices  (use "none" for Python None)
# =============================================================




# =============================================================
# Optimization Evaluation Periods (Multi-period cross-validation)
# =============================================================

[optimization_periods]
periods = [
    { start = "2022-01-01", end = "2022-12-31", label = "Bear 2022" },
    { start = "2024-06-01", end = "2025-12-31", label = "Bull 2024-25" },
]

# =============================================================
# Optimization Holdout Validation (スコア計算に使わない未学習期間)
# 注意: 学習期間（optimization_periods）と重なる期間は定義しないこと。
#       2025-02〜04 は Bull 2024-25 に内包されるため使用禁止。2021 は温存（将来のブル側検証候補）。
# =============================================================

[[optimization_validation.sets]]
label = "stress_bear"   # 引き締め型ベア(2018Q4) + 事故型クラッシュ(COVID)。勝率の安定性を見る
windows = [ { start = "2018-10-01", end = "2018-12-31" }, { start = "2020-02-01", end = "2020-05-31" } ]

[[optimization_validation.sets]]
label = "calm_recent"   # レンジ相場(2023)での無駄撃ち + 学習期間より後の疑似フォワード(2026H1)
windows = [ { start = "2023-01-01", end = "2023-12-31" }, { start = "2026-01-01", end = "2026-06-30" } ]

# =============================================================
# Optimization Pruning Rules
# =============================================================
[optimization_pruning]
min_avg_hits_per_day = 1.0     # 期間中の1日平均ヒット件数の下限
max_avg_hits_per_day = 20.0    # 期間中の1日平均ヒット件数の上限
min_hit_rate_pct = 5.0         # 期間中、1件でもシグナルが出た営業日数の割合（極端な偏りを防ぐ）
