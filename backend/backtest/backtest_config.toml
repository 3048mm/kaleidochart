# Backtest Engine Configuration
# パラメータセットは [[strategy]] を追加するだけで自由に拡張可能

[general]
start_date = "2021-03-26"
end_date   = "2026-03-26"
failsafe_max_days = 120
consider_tax = 0.2  # 単位は率（0.2=20%）。%表記(20.0)を書くと InvalidTaxRateError になる。型2・型3（実運用シミュレーション）専用
consider_tax_optimization = 0.0  # 型1（最適化バックテスト）専用。既定は税なし（doc/completed/objective_quality_first_plan.md §3.2）
# エントリー方式: "close"=シグナル当日終値（オーバーナイト発注運用と整合） / "next_open"=翌営業日寄付（保守側の感度計測用）
entry_mode = "close"
# 流動性ハード制約（最適化対象外・全戦略共通）: 21日平均売買代金がこの値未満の銘柄はシグナル対象外
min_avg_dollar_volume_21 = 2e6

# --- Exit Rules (固定) ---
[exit_rules]
exit_type = "fixed"              # "fixed", "hold", "vxv_vix_ratio"
vxv_vix_threshold = 1.0          # Used when exit_type = "vxv_vix_ratio"
stop_loss_pct = -8.0
partial_take_profit_pct = 20.0
partial_take_profit_sma50_atr_mult = 8.0
partial_ratio = 0.333
full_exit_ema21_consecutive_days = 2
full_exit_sma50_atr_mult = 11.0
time_stop_days = 7
# time_stop_range < 1 ATR

# =============================================================
# Strategy Parameter Sets
# =============================================================
#
# max_allowed_dd の校正について（2026-07-05 再校正 / 2026-08-23 以降は**未使用**）:
#
#   ★★ 2026-08-23 に最適化スコアから DD 項を削除したため、**この値は現在どこからも
#      読まれない**（`optimization_runner` の参照はゼロ。`screener_registry.METADATA_KEYS`
#      には「フィルタではないキー」として登録が残っているのみ）。
#      削除せず残しているのは、下記の戦略ごとの校正値（4段階）が設計知見だからで、
#      型3（個別銘柄シナリオ）側で DD を評価する際に再利用しうる。
#      **再び読むようにする場合は、型1 DD が型3 CAGR と +0.770 の正相関を持つ
#      （DD が大きい戦略ほど CAGR が高い）ことに注意すること。型1 でこれを罰すると
#      良い戦略ほど落ちる。詳細: doc/completed/objective_quality_first_plan.md**
#
#   （以下は 2026-07-05 当時の校正記録）
#   最適化スコアの DD ペナルティ閾値。2026-07-05 に DD 計測を mark-to-market 化
#   （含み損の谷・同時被弾を反映）したため、旧 additive 計測時代の校正値（20% 等）は
#   MTM スケールでは 2〜4 倍厳しく作用していた。全戦略に MTM 基準の値を明示する。
#   スケール感（ポートフォリオ等価 DD の許容水準）:
#     - 攻撃的モメンタム（A, B系）: 35
#     - RRG / F（中庸）: 30
#     - 押し目（D）: 25
#     - VCP（設計上低ボラ・E系）: 20
#   全て未設定時のコード側デフォルトは 20（optimization_runner.calculate_custom_score）。

[[strategy]]
name = "A_momentum_breakout"
description = "出来高を伴った急騰銘柄 (攻撃的)"
max_hits_per_day = 10
sort_column = "rs_ratio_rank_e21"
sort_ascending = false
min_change_1d_pct = 6.0 
min_change_intraday_pct = -2.0 
min_vol_surge_21 = 2.8 
min_adr_pct_21 = 6.0 
max_sma50_atr_mult = 7.0 
min_market_cap = 1e8 
is_rs_ratio_rank_e21_gt_e63 = true
min_avg_hits_per_day = 0.1
min_hit_rate_pct = 1.0
max_allowed_dd = 35.0   # MTM 再校正（旧 20.0）

[strategy.optimization]
min_change_1d_pct  = { type = "float", min = 2.0, max = 10.0, step = 1.0 }
min_change_intraday_pct = { type = "float", min = -8.0, max = 8.0, step = 1.0 }
min_vol_surge_21   = { type = "float", min = 1.0, max = 3.0, step = 0.2 }
min_adr_pct_21     = { type = "float", min = 2.0, max = 6.0, step = 0.5 }
max_sma50_atr_mult = { type = "float", min = 4.0, max = 10.0, step = 0.5 }
min_market_cap     = { type = "categorical", choices = [1e8, 3e8, 1e9] }
is_rs_ratio_rank_e21_gt_e63   = { type = "categorical", choices = [true] }


# B1 は 2026-07-05 にコンセプト転換（旧: テーマ改善中のモメンタム → 新: リーダーテーマの継続）。
# 旧 B1 のシグナルは B2 の上位集合（B2 銘柄の9割超を内包）で独自価値がなかったため、
# B2/B3（テーマの「変化・加速」）と直交する「テーマの水準」特化に変更。旧 study 名: B1_old
[[strategy]]
name = "B1_theme_leader"
description = "確立されたリーダーテーマ（RS%rank上位・水準特化）に属する銘柄のモメンタム。加速条件は持たない（変化系は B2/B3 の役割）"
max_hits_per_day = 10
sort_column = "rs_ratio_rank_e21"
sort_ascending = false
min_change_1d_pct = 8.0
min_vol_surge_21 = 2.4
min_adr_pct_21 = 6.0
# 2026-08-04: 探索レンジ上限を 10.0→6.0 に引き締めたため、既定値も 7.0→6.0 に合わせた。
# 既定値がレンジ外に残ると「最適化なしの実行は 7.0 / 最適化ありは 6.0 以下」という
# 別条件の比較になる。
max_sma50_atr_mult = 6.0
min_market_cap = 1e7
min_theme_rs_ratio_rank_e21 = 0.75
is_close_gt_ema63 = true
max_allowed_dd = 35.0   # MTM 再校正（旧 25.0）

[strategy.optimization]
min_change_1d_pct  = { type = "float", min = 2.0, max = 12.0, step = 1.0 }
# 2026-08-04: B5 と同型の引き締め（B5 は 2026-07-24 に実施済み）。
# vol_surge 下限 0.5→1.5: 21日平均"以下"の出来高は「サージ」の体をなしておらず、
#   出来高の裏付けが薄い銘柄まで通っていた。
# sma50_atr_mult 上限 10.0→6.0: 既に伸びきった銘柄を追いかけるのを抑制する。
# 検証したい仮説: B1 の再最適化での悪化（score 50.1→35.9 / DD -35.5%→-61.9%）が
#   この2点で説明できるか。
min_vol_surge_21   = { type = "float", min = 1.5, max = 4.0, step = 0.1 }
min_adr_pct_21     = { type = "float", min = 1.0, max = 8.0, step = 0.5 }
max_sma50_atr_mult = { type = "float", min = 2.0, max = 6.0, step = 0.5 }
min_market_cap     = { type = "categorical", choices = [1e7, 5e7, 1e8, 3e8, 1e9] }
min_theme_rs_ratio_rank_e21 = { type = "float", min = 0.6, max = 0.95, step = 0.05 }
is_close_gt_ema63 = { type = "categorical", choices = [true] }

