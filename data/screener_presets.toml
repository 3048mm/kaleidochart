# ============================================================
# スクリーナー プリセット定義
#
# Optuna等で最適なパラメータが見つかった場合は、
# このファイルの値を書き換えるだけでフロントエンドに即反映されます。
#
# 【フィルタキー命名規則】
#   min_<column>       : Indicator.<column> >= value
#   max_<column>       : Indicator.<column> <= value
#   <column>           : Indicator.<column> == value (完全一致)
#   min_<col>_rank     : T4 RelativeRank percent_rank >= value
#   max_<col>_rank     : T4 RelativeRank percent_rank <= value
#
# 【計算列 (Virtual Columns / Indicators)】
#   change_1d_pct      : (close - prev_close) / prev_close * 100
#   change_1w_pct      : (close - close_5d_ago) / close_5d_ago * 100
#   change_1m_pct      : (close - close_20d_ago) / close_20d_ago * 100
#   change_intraday_pct : (close - open) / open * 100 (Intraday)
#   dist_21ema_pct     : (close - ema_21) / ema_21 * 100
#   dist_sma50_pct     : (close - sma_50) / sma_50 * 100
#
# 【式フィルタ (expression)】
#   OR条件などの複合条件は expression = "..." で記述可能。
#   例: expression = "dist_sma50_atr > 3 or td9 == -9"
#   対応演算子: >, >=, <, <=, ==, !=, and, or
#   不正な式はログに記録され、条件から除外されます。
#
# 【プリセット共通フィールド】
#   description        : ポップオーバー表示用の日本語説明文
#   [rise.backtest]     : バックテストで実績検証済みの Pickup 系プリセットのみが持つ
#                         成績サマリ（win_rate / expectancy_lcb / port_cagr /
#                         max_drawdown / port_vs_spy / total_trades）。値は
#                         backend/backtest/backtest_config.toml 側の検証結果からの
#                         転記であり、このファイル単体では再計算されない。
#
# 【グループ分類（Rise 側）】
#   Pickup  : 当日の値動きで拾う、バックテストで edge が検証済みの戦略
#   Check   : 1st/2nd pivot・Trend Line Break・ブルードット・VCP など、
#             当日ではなく数日後の推移を観察すべき構造的セットアップ（edge 未検証）
#   Common  : 1D%・出来高等、検証済み edge を謳わない基本指標
# ============================================================

# 有効化する買い戦略(Rise)のID一覧。ここに登録されたIDの戦略のみがフロントエンド・バックテストの両方で使われます。
active_rise_ids = [
    "theme_momentum",
    "momentum_breakout",
    "rrg_improving_in",
    "check_1d_gain"
]

