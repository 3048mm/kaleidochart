# ───────────────────────────────────────────────────
# Rise (買い目線) - Overhead sign
# ───────────────────────────────────────────────────

[[rise]]
id = "climax_top"
name = "Climax Top"
subname = "クライマックストップ・過熱警戒"
group = "Overhead sign"
description = "SMA50乖離が3ATR超、またはTD9カウントが-9に達した過熱警戒シグナル。"
expression = "sma50_atr_mult > 3 or td9 == -9"

[[rise]]
id = "dist_sma50_atr_8"
name = "SMA50/ATR%"
subtitle = "> 8%"
group = "Overhead sign"
description = "SMA50からの乖離が8ATRを超える過熱警戒シグナル。"
[rise.filters]
min_sma50_atr_mult = 8.0

[[rise]]
id = "td9_overhead"
name = "TDR9"
subtitle = ">= 8"
group = "Overhead sign"
description = "TD9カウントが8以上に達した過熱警戒シグナル。"
[rise.filters]
min_td9 = 8

# ───────────────────────────────────────────────────
# Fall (警戒・売り目線) - Warning
# ───────────────────────────────────────────────────

[[fall]]
id = "rrg_lagging_in"
name = "RRG Lagging In"
group = "Warning"
description = "RRGでLagging象限に転落し、出来高を伴って下落した銘柄を検出する警戒シグナル。"
[fall.filters]
rrg_lagging_in = true
max_change_1d_pct = -2.0
min_vol_surge_21 = 1.0

[[fall]]
id = "trend_breakdown"
name = "Trend Breakdown"
group = "Warning"
description = "トレンドテンプレートから外れ、RSが劣化し、SMA50がSMA200を下回った下降トレンド転換の警戒シグナル。"
expression = "is_trend_template == false and rs_ratio_e63 < -1.0 and sma_50 < sma_200"

[[fall]]
id = "high_vol_dist"
name = "High Volume Distribution"
group = "Warning"
description = "出来高を伴う下落(ディストリビューション・デー)を検出する警戒シグナル。"
[fall.filters]
min_vol_surge_21 = 1.5
max_change_1d_pct = -2.0

# ───────────────────────────────────────────────────
# Fall (警戒・売り目線) - Rebound sign
# ───────────────────────────────────────────────────

[[fall]]
id = "oversold_rebound"
name = "Oversold Rebound"
group = "Rebound sign"
description = "TD9カウントが+9かつRS比率が低い、反発の可能性があるシグナル。"
expression = "td9 == 9 and rs_ratio_e14 < 0.2"

[[fall]]
id = "td9_rebound"
name = "TDR9"
subtitle = "<= -8"
group = "Rebound sign"
description = "TD9カウントが-8以下に達した反発警戒シグナル。"
[fall.filters]
max_td9 = -8
