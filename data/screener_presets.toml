# ───────────────────────────────────────────────────
# Rise (買い目線) - Check
# ───────────────────────────────────────────────────
# 当日ではなく数日後の推移を観察すべき構造的セットアップ。
# edge はまだ検証しておらず、Pickup とは異なりバックテスト成績は付与しない
# （structure_pivot_screener_plan.md の実測により、これらをエントリー条件として
# 使うと成績が悪化するケースがあることが分かっている＝観察用途に限定する）。

[[rise]]
id = "check_structure_pivot"
name = "Structure Pivot Watch"
subtitle = "1st pivot 接近"
group = "Check"
description = "構造ピボット(1st pivot)まで0〜5%以内に接近している銘柄を検出。ブレイクのエントリー条件としては非推奨(過去検証で逆効果)。数日後の推移を観察する用途。"
[rise.filters]
min_sp_dist_pivot_pct = 0.0
max_sp_dist_pivot_pct = 5.0

[[rise]]
id = "check_2nd_break"
name = "2nd Break"
subtitle = "本ピボット上抜け"
group = "Check"
description = "構造ピボットの本ピボット(2nd break)を上抜けた銘柄を検出。edge検証は未実施のため観察用途。"
[rise.filters]
is_structure_2nd_break = true
min_market_cap = 3e8

[[rise]]
id = "check_trend_line_break"
name = "Trend Line Break"
subtitle = "下降トレンドライン上抜け"
group = "Check"
description = "下降トレンドライン(カウンタートレンド線)を上抜けた銘柄を検出。edge検証は未実施のため観察用途。"
[rise.filters]
is_structure_trend_line_break = true
min_market_cap = 3e8

[[rise]]
id = "check_vcp_breakout"
name = "VCP Breakout"
subtitle = "収縮ベースからのブレイク"
group = "Check"
description = "収縮した高値圏の土台から出来高を伴って大陽線でブレイクした銘柄を検出(VCPブレイクアウト)。個別銘柄シナリオでは実績が振るわなかった経緯があるため観察用途。"
[rise.filters]
is_vcp_breakout = true
min_market_cap = 3e8

[[rise]]
id = "check_blue_dot"
name = "Blue Dot Recent"
subtitle = "RS新高値先行、直近点灯"
group = "Check"
description = "RSが株価に先行して52週新高値を更新する『ブルードット』が直近5営業日以内に点灯した銘柄を検出。単独でのedgeは未確認のため観察用途。"
[rise.filters]
max_rs_blue_dot_age = 5


