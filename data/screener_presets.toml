# ───────────────────────────────────────────────────
# Rise (買い目線) - Overhead sign
# ───────────────────────────────────────────────────

[[rise]]
id = "climax_top"
name = "Climax Top"
subname = "クライマックストップ・過熱警戒"
group = "Overhead sign"
expression = "dist_sma50_atr > 3 or td9 == -9"

[[rise]]
id = "dist_sma50_atr_8"
name = "SMA50/ATR%"
subtitle = "> 8%"
group = "Overhead sign"
[rise.filters]
min_dist_sma50_atr = 8.0

[[rise]]
id = "td9_overhead"
name = "TDR9"
subtitle = ">= 8"
group = "Overhead sign"
[rise.filters]
min_td9 = 8

# ───────────────────────────────────────────────────
# Fall (警戒・売り目線) - Warning
# ───────────────────────────────────────────────────

[[fall]]
id = "rrg_lagging_in"
name = "RRG Lagging In"
group = "Warning"
special = "rrg_lagging_in"
[fall.filters]
max_change_1d_pct = -2.0
min_vol_surge_21 = 1.0

[[fall]]
id = "trend_breakdown"
name = "Trend Breakdown"
group = "Warning"
expression = "trend_template_ok == 0 and rs_ratio_63 < -1.0 and sma_50 < sma_200"

[[fall]]
id = "high_vol_dist"
name = "High Volume Distribution"
group = "Warning"
[fall.filters]
min_vol_surge_21 = 1.5
max_change_1d_pct = -2.0

# ───────────────────────────────────────────────────
# Fall (警戒・売り目線) - Rebound sign
# ───────────────────────────────────────────────────

[[fall]]
id = "oversold_rebound"
name = "Oversold Rebound"
group = "Rebound sign"
expression = "td9 == 9 and rs_ratio_14 < 0.2"

[[fall]]
id = "td9_rebound"
name = "TDR9"
subtitle = "<= -8"
group = "Rebound sign"
[fall.filters]
max_td9 = -8
