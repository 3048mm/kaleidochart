# 複数戦略の組み合わせ（和集合）ジョブの書き方:
#   strategy_code / study_name の代わりに strategy_codes / study_names（配列）を使う。
#   両者は同じ長さでなければならず、長さ不一致・単複併記はエラーで停止する。
#   [job.portfolio] min_score = 1 は「どれか1戦略でも拾えば買う」和集合の指定。
#   （score=2以上のみ採用する「合流」を試す場合は min_score を上げる）
#
# 2026-08-21: B2 + B5 + B6 の組み合わせ検証。
# 2026-08-21 の税込みシナリオテストで、質の高い戦略（B2/B5）ほど枠が空いている
# （枠稼働率 28〜33%）ことが判明した。質を保ったまま取引数を増やせるかを検証する。
# 詳細: doc/in_progress/multi_strategy_scenario_plan.md
[[job]]
name = "B256_union"
strategy_codes = ["B2_theme_rsrank_momentum", "B5_rs_trend_with_theme", "B6_rs_macd_and_theme"]
study_names    = ["B2_theme_rsrank_momentum", "B5_rs_trend_with_theme", "B6_rs_macd_and_theme"]
source = "optuna"
  [job.portfolio]
  min_score = 1

# 記述例（手動変更パラメータの比較テスト用）:
# [[job]]
# name = "B4_manual_vol_surge_2.0"
# strategy_code = "B4_rs_trend_with_theme"
# source = "manual"
# base_study_name = "opt_strategy_B4_rs_trend_with_theme_multi_period"
# [job.override_params]
# min_vol_surge_21 = 2.0

# 2026-08-16: B6 の「書き戻し前」パラメータでの比較検証。
# 2026-08-16 のシナリオテストで B6 は取引数 393 と多いのに CAGR 32.43 で B 中最下位、
# 1取引 +3.24% / PF 1.40 と B2/B3/B5（+5〜6% / PF 1.8〜1.9）に見劣りした。
# 書き戻しで min_change_1d_pct 9.0→4.0・is_rs_macd_hist_rising_21 true→false と
# 「急騰かつ加速」の選別が大きく緩んだのが原因か（＝最適化前の方が良かったか）を検証する。
# 値は c60293b^ 時点の screener_presets.toml（RS MACD and Theme）から取得。
[[job]]
name = "B6_prev_params"
strategy_code = "B6_rs_macd_and_theme"
source = "manual"
  [job.override_params]
  min_change_1d_pct = 9.0
  min_dist_21ema_pct = 3.0
  min_vol_surge_21 = 1.8
  min_adr_pct_21 = 6.0
  max_sma50_atr_mult = 7.5
  min_market_cap = 1e7
  min_rs_trend_rank_s21 = 0.9
  min_rs_macd_hist_21 = 0.0
  min_theme_rs_trend_s21 = 0.9
  is_theme_rs_trend_rank_s14_gt_s21 = true
  is_close_gt_ema63 = true
  is_rs_macd_hist_rising_21 = true


# =============================================================
# H3: Trend Line Break（カウンタートレンド線の上抜け）
# =============================================================
# 型1（最適化）の結論は doc/completed/trend_line_break_optimization_plan.md §6.4。
#   Alpha +2.87%（E2 +1.12% 超・B5 +4.97% に次ぐ2位）
#   ホールドアウト4期間中3期間で正（pooled LCB +1.17 / +1.50）
#   ただし勝率 25.9% / in-sample LCB -0.90 と裾に依存する
#
# **型3 で確かめたいこと**: 型1で見えた「相場つき依存」が実運用条件で出るか。
#   2020-02〜05（V字反発）で勝率 64.7% / 2022 のじり安で最大DD を作っている。
#   MTS 連動の型3なら、じり安局面でポジションを絞れる分だけ改善するはず。
#
# **型1の DD -141.2% をそのまま持ち込まないこと。** あれは
# 「生の合計%pt / avg_slots（期間平均 4.82）」で、シグナルが集中する戦略では
# 分母が実態より小さくなる（同時保有の実測は中央値3・95%タイル14・最大30枠）。
# 実効分母で割り直すと -23〜-49% 相当。型3の DD が本来の値。
[[job]]
name = "H3_tlb"
strategy_code = "H3_structure_trend_line_break"
source = "optuna"
study_name = "H3_structure_trend_line_break"

# 同じ戦略で保有数を絞った版。シグナルが集中する（最大30枠）ため、
# 枠が埋まったときの挙動が既定8枠と変わるかを見る
[[job]]
name = "H3_tlb_narrow"
strategy_code = "H3_structure_trend_line_break"
source = "optuna"
study_name = "H3_structure_trend_line_break"
  [job.portfolio]
  max_positions = 4

