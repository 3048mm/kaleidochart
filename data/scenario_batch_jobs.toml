# =============================================================
# Scenario Test Batch Jobs Configuration
# =============================================================
#
# このファイルは、並列シナリオテストバッチ（run_scenario_batch.py）の実行対象ジョブを定義します。
# フォルダ名やパラメータの競合を避け、並行比較を行うことができます。
#
# ジョブの属性:
# - name:           出力フォルダ名 (output/scenario/{name}/) および画面表示名。
# - strategy_code:  backtest_config.toml 内の [[strategy]] の name。
# - source:         パラメータの取得元。 "optuna" または "manual"。
# - study_name:     (source="optuna" の場合必須) 最良パラメータを取得する Optuna の Study 名。
# - base_study_name: (source="manual" の場合任意) 上書きパラメータのベースとなる Optuna の Study 名。
# - override_params: (source="manual" または "optuna" で上書きしたい場合任意) 手動で上書きするパラメータ辞書。

